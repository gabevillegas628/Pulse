name: CI

# Push only, deliberately. Every branch here is pushed before it is reviewed, so
# adding pull_request would double every run without catching anything earlier.
on: push

jobs:
  build:
    name: Build and clock tests
    runs-on: ubuntu-latest

    env:
      # `prisma generate` reads the schema, not the database, and the clock half of
      # the autoclose suite never opens a connection. A syntactically valid URL is
      # all either one needs — nothing in this job talks to Postgres.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Covers the typecheck: every workspace build runs tsc, and the backend's
      # also runs prisma generate, so a schema that no longer matches the client
      # fails here rather than on deploy.
      - name: Build all workspaces
        run: npm run build

      # The clock is the piece where a regression is silent and expensive: it would
      # accept answers after a countdown ended, and nobody in the room would know.
      # Driven on injected timestamps, so it needs neither a server nor a database.
      - name: Clock unit tests
        run: npm run test:clock

      # The list behind the slide's "students are waiting — Start?" button. Pure, like the clock.
      - name: Waiting list unit tests
        run: npm run test:waiting --workspace=backend

      # Quiz grader scoring and seed content (docs/quiz-grader). Pure; the model half
      # is measured by the Phase 0 spike, which needs an API key and real scans.
      - name: Quiz grader unit tests
        run: npm run test:quiz-grader --workspace=backend

      # Not yet wired: smoke-themes.ts and e2e-qr.ts. Both want a Postgres service
      # and a booted backend, and smoke-themes additionally spends real Anthropic
      # tokens, so it needs a decision about a CI key before it belongs here.

  vision:
    name: Quiz grader vision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vision/requirements.txt

      - run: pip install -r vision/requirements.txt

      # Builds pages from the real sample quizzes (copier scans, angled phone photos,
      # versions A-C) and checks each lines up, gets its version, and keeps its writing.
      - name: Vision pipeline tests
        run: python -m unittest vision/test_pipeline.py -v
