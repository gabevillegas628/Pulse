# Apache virtual host for Pulse, for OIT to add to /etc/httpd/conf.d/ (as on the DSAP server).
#
# Pulse is one app at the root of its own hostname: Apache terminates HTTPS with OIT's
# certificate and passes everything to the app on 127.0.0.1:3001. Modelled on the DSAP vhost.
#
# Needs: mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite, mod_remoteip,
# mod_headers: all loaded by default in RHEL's httpd + mod_ssl (tested on httpd 2.4.62).
# With SELinux enforcing, Apache also needs permission to connect to the app:
#    setsebool -P httpd_can_network_connect 1
#
# Replace pulse.dls.rutgers.edu with the real hostname throughout.

<VirtualHost *:80>
  ServerName pulse.dls.rutgers.edu
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName pulse.dls.rutgers.edu

  # OIT's certificate, as for other hosted services.
  SSLEngine on
  SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
  SSLHonorCipherOrder On
  SSLCompression off
  SSLCertificateFile /etc/pki/tls/certs/pulse.dls.rutgers.edu.crt
  SSLCertificateKeyFile /etc/pki/tls/private/pulse.dls.rutgers.edu.key
  SSLCertificateChainFile /etc/pki/tls/certs/InCommonBundle-SHA2.crt

  # Real client addresses through the campus proxy/load balancer, as on DSAP. Apache then
  # passes the client's address to the app in X-Forwarded-For; the app trusts one hop, so a
  # forged header from anywhere else is ignored. trusted-proxy.lst must list the campus
  # proxy: an empty list makes mod_remoteip trust everyone.
  RemoteIPHeader X-Forwarded-For
  RemoteIPInternalProxyList conf/trusted-proxy.lst
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port 443

  LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
  CustomLog "/var/log/httpd/pulse.dls.rutgers.edu_access_log" proxy
  ErrorLog "/var/log/httpd/pulse.dls.rutgers.edu_error_log"

  # No upload limit here: Apache does not apply LimitRequestBody to proxied requests (tested).
  # The app enforces its own 300 MB limit on scanned quiz PDFs.

  # Live updates in class (Socket.io over WebSockets). Rewrite-based, so it works on any
  # httpd 2.4 including RHEL 8's.
  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/?(.*) "ws://127.0.0.1:3001/$1" [P,L]

  # Everything else. Long-polling and large uploads need more than the default timeout.
  ProxyPreserveHost On
  ProxyRequests Off
  ProxyPass        / http://127.0.0.1:3001/ timeout=300
  ProxyPassReverse / http://127.0.0.1:3001/

  # No HSTS header here: the app already sends one.
</VirtualHost>
